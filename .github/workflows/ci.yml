name: AudienceIQ CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Automated Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib fastapi uvicorn requests pytest httpx
          
      - name: Train initial model artifacts
        run: |
          python services/trainer/train.py
          
      - name: Run Pytest test suite
        run: |
          python -m pytest tests/

  docker-build:
    name: Verify Docker Compose Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker Compose Stack
        run: |
          docker compose build
